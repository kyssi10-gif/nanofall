<!doctype html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0b0f1a" />
<title>NANOFALL</title>
<style id="gate-style">
  html, body { margin: 0; height: 100%; background: #0b0f1a; color: #e6eef7; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
  #gate { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; box-sizing: border-box; }
  #gate h1 { margin: 0; font-size: clamp(44px, 9vw, 92px); font-weight: 900; letter-spacing: 0.08em; color: #cfeaff; }
  #gate h1 span { color: #ff7a2f; }
  #gate form { display: flex; flex-direction: column; gap: 12px; width: min(360px, 90vw); }
  #gate input[type=password] { font-size: 22px; padding: 14px 16px; border-radius: 8px; border: 2px solid #2a3a55; background: #101827; color: #fff; outline: none; }
  #gate input[type=password]:focus { border-color: #58f0ff; }
  #gate button { font-size: 20px; font-weight: 800; letter-spacing: 0.08em; padding: 14px; border-radius: 8px; border: 0; cursor: pointer; background: linear-gradient(180deg, #ff8a3f, #e85a12); color: #1a0d05; }
  #gate label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #8a98ad; }
  #gate .msg { min-height: 1.4em; color: #ff6b7a; font-size: 15px; text-align: center; }
  #gate .msg.ok { color: #8a98ad; }
</style>
</head>
<body>
<div id="gate">
  <h1>NANO<span>FALL</span></h1>
  <form id="gate-form" autocomplete="off">
    <input id="gate-pass" type="password" placeholder="Heslo" autofocus />
    <label><input id="gate-keep" type="checkbox" checked /> Zapamatovat na tomto zařízení</label>
    <button type="submit">ODEMKNOUT</button>
    <div class="msg" id="gate-msg"></div>
  </form>
</div>
<script>
(() => {
  const SALT = new Uint8Array([211,54,184,152,183,68,71,46,202,12,34,5,37,176,179,214]), ITER = 300000, KEY_STORE = 'nanofall.brana.klic';
  const msg = document.getElementById('gate-msg');
  const say = (t, ok) => { msg.textContent = t; msg.className = ok ? 'msg ok' : 'msg'; };
  const b64 = (u8) => btoa(String.fromCharCode(...u8));
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  let data = null;
  const load = () => data || (data = fetch('game.enc?v=1795111494593').then((r) => { if (!r.ok) throw new Error('net'); return r.arrayBuffer(); }));

  async function deriveRaw(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: SALT, iterations: ITER, hash: 'SHA-256' }, base, 256));
  }

  /** Zkusí hru odemknout klíčem; vrací true, když se povedlo. */
  async function unlock(raw) {
    const buf = new Uint8Array(await load());
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    let plain;
    try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12)); } catch { return false; }
    const game = JSON.parse(new TextDecoder().decode(plain));
    document.getElementById('gate-style').remove();
    const style = document.createElement('style');
    style.textContent = game.css;
    document.head.appendChild(style);
    document.body.innerHTML = game.body;
    if (game.cloud) window.__NANOFALL_CLOUD__ = game.cloud;
    const url = URL.createObjectURL(new Blob([game.js], { type: 'text/javascript' }));
    await import(url);
    return true;
  }

  async function start() {
    if (!window.crypto || !crypto.subtle) { say('Tento prohlížeč neumí šifrování (stránka musí běžet přes https).'); return; }
    // uložený klíč z minula → rovnou do hry
    let saved = null;
    try { saved = localStorage.getItem(KEY_STORE); } catch {}
    if (saved) {
      say('Odemykám…', true);
      try { if (await unlock(unb64(saved))) return; } catch {}
      try { localStorage.removeItem(KEY_STORE); } catch {}
      say('');
    }
    document.getElementById('gate-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pass = document.getElementById('gate-pass').value;
      if (!pass) return;
      const keep = document.getElementById('gate-keep').checked; // po odemčení už formulář neexistuje
      say('Odemykám…', true);
      try {
        const raw = await deriveRaw(pass);
        if (await unlock(raw)) {
          if (keep) { try { localStorage.setItem(KEY_STORE, b64(raw)); } catch {} }
        } else say('Špatné heslo.');
      } catch (err) { say('Nepodařilo se načíst hru. Zkontroluj připojení a zkus to znovu.'); }
    });
  }
  start();
})();
</script>
</body>
</html>
